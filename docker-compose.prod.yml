version: '3.8'

services:
  # --- INFRASTRUCTURE (PHASE 0) ---
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      - POSTGRES_USER=setu_user
      - POSTGRES_PASSWORD=setu_secure_password
      - POSTGRES_DB=setu_db
    ports:
      - "5432:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  # --- SERVICES (PHASE 1-3) ---
  nlp-processor:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -u main.py
    depends_on:
      - kafka
      - db
    environment:
      - DATABASE_URL=postgresql://setu_user:setu_secure_password@db:5432/setu_db
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  alert-manager:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python services/alerts/alert_manager.py
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql://setu_user:setu_secure_password@db:5432/setu_db

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -u api/main.py
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://setu_user:setu_secure_password@db:5432/setu_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SETU_API_KEY=${SETU_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN}

  reddit-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: python -u scripts/reddit_ingest.py
    depends_on:
      - kafka
      - db
    environment:
      - DATABASE_URL=postgresql://setu_user:setu_secure_password@db:5432/setu_db
      - KAFKA_BROKER=kafka:9092
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT}
      - INDIA_SUBREDDITS=${INDIA_SUBREDDITS}
      - MEDICAL_SUBREDDITS=${MEDICAL_SUBREDDITS}
      - REDDIT_KEYWORDS=${REDDIT_KEYWORDS}

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.node
    ports:
      - "5173:5173"
    depends_on:
      - api
